commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    biome:
      glob: '*.{js,ts,jsx,tsx,json,jsonc}'
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    stylelint:
      glob: '*.css'
      run: pnpm exec stylelint {staged_files}

pre-push:
  commands:
    changeset-required:
      run: node scripts/require-changeset.ts
